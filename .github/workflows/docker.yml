name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GitHub Container Registry on main

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: invoicelens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the public demo (no model, keyword fallback)
        run: |
          docker run -d --name demo -p 8000:8000 \
            -e INVOICELENS_DEMO=1 -e LLM_BASE_URL=http://127.0.0.1:9/v1 invoicelens:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/healthz && break; sleep 1; done
          for i in $(seq 1 30); do
            n=$(curl -fs http://localhost:8000/api/invoices | python3 -c "import sys, json; print(len(json.load(sys.stdin)))" || echo 0)
            [ "$n" = "10" ] && break; sleep 1
          done
          echo "sample invoices loaded: $n"
          test "$n" = "10"
          curl -fs http://localhost:8000/api/config
          curl -fs -o /dev/null http://localhost:8000/
          curl -fs -o /dev/null "http://localhost:8000/api/accountant-pack.zip?month=2026-10"

      - name: Container logs
        if: always()
        run: docker logs demo || true

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ghcr.io/${{ github.repository }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
