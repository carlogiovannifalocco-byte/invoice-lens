# Fully local: InvoiceLens + Gemma on Ollama. Nothing leaves your machine.
services:
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: gemma3:4b
      INVOICELENS_DB: /data/invoicelens.db
    volumes: [data:/data]
    depends_on: [ollama]
volumes:
  ollama:
  data:
